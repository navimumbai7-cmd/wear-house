<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24"/>
      <stop offset="100%" stopColor="#f59e0b"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef3c7"/>
      <stop offset="100%" stopColor="#fde68a"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer border accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Isometric Warehouse / Cube Symbol -->
  <g transform="translate(256, 230)">
    <!-- Top Face -->
    <path d="M 0 -100 L 110 -40 L 0 20 L -110 -40 Z" fill="url(#boxTop)"/>
    <!-- Left Face -->
    <path d="M -110 -40 L 0 20 L 0 140 L -110 80 Z" fill="url(#amberGlow)"/>
    <!-- Right Face -->
    <path d="M 0 20 L 110 -40 L 110 80 L 0 140 Z" fill="#d97706"/>
    <!-- Seam lines -->
    <path d="M 0 20 L 0 140" stroke="#b45309" stroke-width="4"/>
  </g>

  <!-- Barcode Overlay Stripes across lower section -->
  <g transform="translate(136, 385)">
    <rect x="0" y="0" width="8" height="42" fill="#fbbf24" rx="3"/>
    <rect x="16" y="0" width="14" height="42" fill="#fbbf24" rx="3"/>
    <rect x="38" y="0" width="6" height="42" fill="#fbbf24" rx="3"/>
    <rect x="52" y="0" width="18" height="42" fill="#fbbf24" rx="3"/>
    <rect x="78" y="0" width="10" height="42" fill="#fbbf24" rx="3"/>
    <rect x="96" y="0" width="6" height="42" fill="#fbbf24" rx="3"/>
    <rect x="110" y="0" width="22" height="42" fill="#fbbf24" rx="3"/>
    <rect x="140" y="0" width="8" height="42" fill="#fbbf24" rx="3"/>
    <rect x="156" y="0" width="16" height="42" fill="#fbbf24" rx="3"/>
    <rect x="180" y="0" width="8" height="42" fill="#fbbf24" rx="3"/>
    <rect x="196" y="0" width="14" height="42" fill="#fbbf24" rx="3"/>
    <rect x="218" y="0" width="22" height="42" fill="#fbbf24" rx="3"/>
  </g>
</svg>
